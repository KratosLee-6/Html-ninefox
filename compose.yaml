services:
  htmlninefox:
    build: .
    ports:
      - "8620:8620"
    environment:
      # 真实 LLM 接入（MiniMax-M3 优先；按需替换为 OPENAI_API_KEY / ANTHROPIC_API_KEY）
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - htmlninefox-data:/home/fox/.htmlninefox
      - htmlninefox-output:/home/fox/htmlninefox-output
    restart: unless-stopped

volumes:
  htmlninefox-data:
  htmlninefox-output:
