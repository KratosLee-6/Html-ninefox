[package]
name = "htmlninefox-shell"
version = "0.9.0"
description = "Html九尾狐 桌面壳：Tauri 窗口 + PyInstaller sidecar（与便携包/安装包并存）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
