<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🦊 Html九尾狐 · 无限画布工作台</title>
<meta name="theme-color" content="#14141A">
<meta name="application-name" content="Html九尾狐">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Html九尾狐">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root {
  --bg-base:#0A0A0F; --bg-panel:#14141A; --bg-elevated:#1B1B23; --bg-hover:#22222C;
  --border-subtle:#23232E; --border-default:#2A2A36; --border-strong:#3A3A48;
  --text-primary:#EDEDF2; --text-secondary:#9B9BA8; --text-tertiary:#63636F;
  --accent:#7C3AED; --accent-hover:#8B5CF6; --accent-soft:rgba(124,58,237,.14);
  --indigo:#5B5FCF; --success:#4ADE80; --warning:#FBBF24; --danger:#F87171;
  --info:#60A5FA; --amber:#F59E0B; --cyan:#22D3EE; --pink:#F43F5E; --green:#10B981;
  --radius:8px; --shadow:0 8px 28px rgba(0,0,0,.5);
  --wire:#4A4A5A; --wire-soft:#2E2E3C;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg-base); color:var(--text-primary); font-size:13px; line-height:1.55;
  -webkit-font-smoothing:antialiased; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea,select { font-family:inherit; }
.app { display:grid; height:100vh;
  grid-template-rows:46px 1fr 58px;
  grid-template-columns:216px 1fr 264px;
  grid-template-areas:"topbar topbar topbar" "sidebar canvas inspector" "timeline timeline timeline"; }

/* ---------- topbar ---------- */
.topbar { grid-area:topbar; background:var(--bg-panel); border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:center; gap:12px; padding:0 14px; }
.logo { font-weight:700; font-size:14px; white-space:nowrap; }
.logo em { font-style:normal; color:var(--accent-hover); }
.ver { color:var(--text-tertiary); font-size:11px; }
.divider-v { width:1px; height:18px; background:var(--border-default); }
.mode-badge { font-size:11px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; white-space:nowrap; }
.mode-badge::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--success); }
.sp { flex:1; }
.btn { height:28px; padding:0 12px; border-radius:var(--radius); font-size:12px; font-weight:500;
  display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; transition:all .12s; white-space:nowrap; }
.btn-ghost { color:var(--text-secondary); } .btn-ghost:hover { background:var(--bg-hover); color:var(--text-primary); }
.btn-secondary { background:var(--bg-elevated); border-color:var(--border-default); }
.btn-secondary:hover { border-color:var(--border-strong); }
.btn-primary { background:var(--accent); color:#fff; font-weight:600; }
.btn-primary:hover { background:var(--accent-hover); }
.btn-primary:disabled { opacity:.45; cursor:wait; }
.btn-danger-ghost { color:var(--danger); }
.status-dot { font-size:11.5px; color:var(--text-secondary); max-width:340px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.status-dot.ok { color:var(--success); }

/* ---------- sidebar：全可视化素材库 ---------- */
.sidebar { grid-area:sidebar; background:var(--bg-panel); border-right:1px solid var(--border-subtle);
  display:flex; flex-direction:column; min-height:0; }
.tabs { display:flex; padding:8px 8px 0; gap:2px; }
.tab { flex:1; padding:7px 2px; font-size:11.5px; color:var(--text-secondary); text-align:center;
  border-radius:6px 6px 0 0; border-bottom:2px solid transparent; white-space:nowrap; }
.tab:hover { color:var(--text-primary); background:var(--bg-hover); }
.tab.on { color:var(--text-primary); border-bottom-color:var(--accent); font-weight:600; }
.search-wrap { padding:9px 10px 5px; }
.search { width:100%; height:27px; background:var(--bg-base); border:1px solid var(--border-default);
  border-radius:6px; color:var(--text-primary); padding:0 10px; font-size:12px; }
.search:focus { outline:none; border-color:var(--accent); }
.pal-list { flex:1; overflow-y:auto; padding:6px 10px 14px; }
.pal-list::-webkit-scrollbar { width:8px; } .pal-list::-webkit-scrollbar-thumb { background:var(--border-default); border-radius:4px; }
.pal-group-title { font-size:10.5px; color:var(--text-tertiary); text-transform:uppercase;
  letter-spacing:.1em; margin:10px 2px 6px; }
.pal-card { background:var(--bg-elevated); border:1px solid var(--border-subtle); border-radius:var(--radius);
  padding:7px; margin-bottom:7px; cursor:grab; transition:border-color .12s, transform .12s; user-select:none; }
.pal-card:hover { border-color:var(--accent); transform:translateY(-1px); }
.pal-card:active { cursor:grabbing; }
.pal-name { font-size:11px; font-weight:600; color:var(--text-secondary); margin-top:5px;
  display:flex; align-items:center; gap:5px; }
.pal-name .en { margin-left:auto; color:var(--text-tertiary); font-weight:400; font-size:9.5px;
  text-transform:uppercase; letter-spacing:.06em; }
.pal-hint { color:var(--text-tertiary); font-size:11px; padding:10px 4px; line-height:1.7; }

/* 迷你线框预览 */
.mini { position:relative; height:76px; border-radius:6px; overflow:hidden;
  background:#0D0D13; border:1px solid var(--border-subtle); }
.mini i { position:absolute; background:var(--wire-soft); border-radius:2px; }
.mini i.a { background:var(--accent); } .mini i.b { background:var(--wire); }
.mini i.c { background:var(--cyan); } .mini i.m { background:var(--pink); }
.mini i.g { background:var(--green); } .mini i.y { background:var(--amber); }
/* 风格/色板卡 */
.style-card .mini { display:flex; flex-direction:column; }
.style-card .mini .row { display:flex; height:50%; }
.style-card .mini .row i { position:static; flex:1; border-radius:0; }
.style-card .mini .aa { flex:1; display:flex; align-items:center; justify-content:center;
  color:var(--text-primary); font-size:19px; font-weight:700; }
/* 字体卡 */
.font-card .mini { display:flex; align-items:center; justify-content:center; }
.font-card .mini .aa { font-size:30px; color:var(--text-primary); }
.font-card .mini .aa small { font-size:10px; color:var(--text-tertiary); margin-left:9px; letter-spacing:.1em; }
/* 文件缩略 */
.file-thumb { position:relative; height:96px; border-radius:6px; overflow:hidden;
  background:#fff; border:1px solid var(--border-subtle); pointer-events:none; }
.file-thumb iframe { width:900px; height:560px; border:none; transform:scale(0.155);
  transform-origin:0 0; pointer-events:none; }
.template-thumb { position:relative; height:104px; border-radius:7px; overflow:hidden; background:#fff;
  border:1px solid var(--border-default); box-shadow:inset 0 0 0 1px rgba(255,255,255,.04); }
.template-thumb iframe { width:960px; height:640px; border:0; transform:scale(.17); transform-origin:0 0;
  pointer-events:none; background:#fff; }
.template-thumb .preview-open { position:absolute; right:6px; bottom:6px; padding:4px 7px; border-radius:5px;
  background:rgba(10,10,15,.86); color:#fff; border:1px solid rgba(255,255,255,.18); font-size:10px;
  opacity:0; transform:translateY(3px); transition:.15s; }
.pal-card:hover .preview-open, .preview-open:focus-visible { opacity:1; transform:none; }
.template-node-preview { position:relative; height:132px; overflow:hidden; background:#fff; border-bottom:1px solid var(--border-subtle); }
.node .template-node-preview iframe { width:960px; height:640px; border:0; transform:scale(.235); transform-origin:0 0;
  pointer-events:none; background:#fff; }

/* ---------- canvas ---------- */
.canvas-wrap { grid-area:canvas; position:relative; overflow:hidden; background:var(--bg-base); min-width:0; }
#viewport { position:absolute; inset:0; cursor:grab; }
#viewport.panning { cursor:grabbing; }
#world { position:absolute; left:0; top:0; transform-origin:0 0; }
.grid-bg { position:absolute; inset:-6000px; background-image:
  radial-gradient(circle, #23232C 1px, transparent 1px); background-size:26px 26px; pointer-events:none; }
#edges { position:absolute; overflow:visible; pointer-events:none; }
#edges path { fill:none; stroke:var(--border-strong); stroke-width:2; }
#edges path.hot { stroke:var(--accent); stroke-width:2.5; filter:drop-shadow(0 0 6px rgba(124,58,237,.5)); }
#edges path.temp { stroke:var(--accent-hover); stroke-dasharray:6 5; }
.alignment-guide { position:absolute; z-index:20; pointer-events:none; background:var(--cyan);
  box-shadow:0 0 8px rgba(34,211,238,.55); opacity:.82; }
.alignment-guide.x { top:-6000px; bottom:-6000px; width:1px; }
.alignment-guide.y { left:-6000px; right:-6000px; height:1px; }

/* 节点 */
.node { position:absolute; left:0; top:0; background:var(--bg-panel); border:1px solid var(--border-default);
  border-radius:10px; box-shadow:var(--shadow); min-width:150px; user-select:none; z-index:2;
  will-change:transform; contain:layout style; }
.node.dragging { z-index:12; box-shadow:0 18px 50px rgba(0,0,0,.42); cursor:grabbing; }
.node.link-target { border-color:var(--cyan); box-shadow:0 0 0 2px rgba(34,211,238,.2),var(--shadow); }
.node.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow); }
.node-head { display:flex; align-items:center; gap:7px; padding:6px 10px; cursor:grab;
  border-bottom:1px solid var(--border-subtle); font-size:11.5px; font-weight:600; }
.node-head:active { cursor:grabbing; }
.node-head .kind { margin-left:auto; font-size:9.5px; color:var(--text-tertiary); font-weight:500;
  letter-spacing:.06em; text-transform:uppercase; }
.node-body { padding:8px 9px; font-size:12px; color:var(--text-secondary); }
.node textarea { width:100%; min-height:48px; background:var(--bg-base); color:var(--text-primary);
  border:1px solid var(--border-default); border-radius:6px; padding:6px 9px; font-size:12px; resize:vertical; }
.node textarea:focus { outline:none; border-color:var(--accent); }
.node select { width:100%; height:27px; background:var(--bg-base); border:1px solid var(--border-default);
  border-radius:6px; color:var(--text-primary); font-size:12px; margin-bottom:6px; padding:0 6px; }
.node .lbl { font-size:10px; color:var(--text-tertiary); margin:5px 0 3px; letter-spacing:.05em; }
.port { position:absolute; top:29px; transform:translateY(-50%); width:14px; height:14px;
  border-radius:50%; background:var(--bg-elevated); border:2px solid var(--border-strong); cursor:crosshair; z-index:6;
  transition:transform .12s,border-color .12s,background .12s,box-shadow .12s; }
.port::before { content:''; position:absolute; inset:-12px; border-radius:50%; }
.port-in { left:-8px; } .port-out { right:-8px; }
.port:hover, .port.link-target { border-color:var(--cyan); background:var(--cyan);
  transform:translateY(-50%) scale(1.28); box-shadow:0 0 0 5px rgba(34,211,238,.14); }
.node iframe { width:100%; height:232px; border:none; background:#fff; border-radius:0 0 9px 9px; display:block; }
.node .thumb-mini { padding:8px 9px 4px; }
.rev-chip { font-size:10px; color:var(--cyan); background:rgba(34,211,238,.1);
  border:1px solid rgba(34,211,238,.3); padding:1px 8px; border-radius:999px; }
.meta-row { display:flex; gap:5px; flex-wrap:wrap; padding:7px 10px 0; }
.meta-chip { font-size:10px; color:var(--text-secondary); background:var(--bg-elevated);
  border:1px solid var(--border-subtle); padding:2px 8px; border-radius:999px; }
.meta-chip b { color:var(--accent-hover); font-weight:600; }
.an-chips { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
.an-chips span { font-size:10px; padding:2px 8px; border-radius:999px; background:var(--accent-soft);
  color:var(--accent-hover); border:1px solid rgba(124,58,237,.3); font-weight:600; }
.an-chips span.dim { background:var(--bg-elevated); color:var(--text-secondary); border-color:var(--border-subtle); font-weight:400; }
.node .spin { color:var(--accent-hover); font-size:11px; animation:blink 1s infinite; }
@keyframes blink { 50% { opacity:.35; } }

/* 工作区框架 */
.node.ws { --workspace-color:var(--accent); --workspace-tint:rgba(124,58,237,.04);
  background:linear-gradient(145deg,var(--workspace-tint),rgba(255,255,255,.008));
  border:1.5px dashed var(--workspace-color); border-radius:16px; box-shadow:none; z-index:1;
  cursor:grab; touch-action:none; }
.node.ws.dragging { cursor:grabbing; box-shadow:0 18px 60px rgba(0,0,0,.2); }
.node.ws.selected { box-shadow:0 0 0 2px color-mix(in srgb,var(--workspace-color) 22%,transparent); }
.ws-head { position:absolute; top:8px; left:10px; display:flex; align-items:center; gap:7px;
  pointer-events:auto; background:var(--bg-panel); border:1px solid var(--border-default);
  border-radius:8px; padding:4px 8px; cursor:grab; box-shadow:var(--shadow); z-index:5; }
.ws-head:active { cursor:grabbing; }
.ws-head .nm { font-size:11.5px; font-weight:600; max-width:200px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.ws-head .cnt { font-size:10px; color:var(--text-tertiary); }
.ws-head button { height:22px; padding:0 9px; border-radius:6px; font-size:10.5px;
  background:var(--bg-elevated); border:1px solid var(--border-default); color:var(--text-secondary); }
.ws-head button:hover { color:var(--text-primary); border-color:var(--accent); }
.ws-head button.go { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
.ws-head button.go:hover { background:var(--accent-hover); }
.ws-head button.go:disabled { opacity:.5; cursor:wait; }
.ws-handle { position:absolute; right:-7px; bottom:-7px; width:15px; height:15px; pointer-events:auto;
  cursor:nwse-resize; border-radius:4px; background:var(--bg-elevated); border:2px solid var(--border-strong); }
.ws-handle:hover { border-color:var(--accent); }
.node.ws .port { display:none; }

/* 工作区导航器 */
.workspace-navigator { position:absolute; left:14px; top:14px; width:240px; z-index:20;
  background:color-mix(in srgb,var(--bg-panel) 92%,transparent); border:1px solid var(--border-default);
  border-radius:10px; box-shadow:0 14px 36px rgba(0,0,0,.28); backdrop-filter:blur(14px); overflow:hidden; }
.workspace-nav-head { height:36px; padding:0 8px 0 11px; display:flex; align-items:center; gap:7px;
  border-bottom:1px solid var(--border-subtle); color:var(--text-secondary); font-size:11px; font-weight:650; }
.workspace-nav-head strong { color:var(--text-primary); font-size:11.5px; }
.workspace-nav-head .sp { flex:1; }
.workspace-nav-head button { width:24px; height:24px; border-radius:6px; color:var(--text-secondary); }
.workspace-nav-head button:hover { background:var(--bg-hover); color:var(--text-primary); }
.workspace-list { padding:6px; display:grid; gap:3px; max-height:240px; overflow:auto; }
.workspace-nav-empty { padding:12px; color:var(--text-tertiary); font-size:11px; line-height:1.65; }
.workspace-nav-item { display:grid; grid-template-columns:1fr 26px; gap:3px; border-radius:7px; }
.workspace-nav-item.active { background:var(--bg-hover); }
.workspace-nav-main { min-width:0; display:grid; grid-template-columns:9px 1fr auto; align-items:center; gap:8px;
  padding:7px 8px; border-radius:7px; text-align:left; }
.workspace-nav-main:hover { background:var(--bg-hover); }
.workspace-dot { width:9px; height:9px; border-radius:3px; background:var(--workspace-color); box-shadow:0 0 0 2px color-mix(in srgb,var(--workspace-color) 18%,transparent); }
.workspace-nav-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; font-weight:560; }
.workspace-nav-count { color:var(--text-tertiary); font-size:10px; white-space:nowrap; }
.workspace-nav-edit { border-radius:6px; color:var(--text-tertiary); font-size:11px; }
.workspace-nav-edit:hover { background:var(--bg-elevated); color:var(--text-primary); }
.workspace-navigator.collapsed .workspace-list { display:none; }
.workspace-navigator.collapsed { width:154px; }

/* HUD */
.hud { position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:6px; z-index:10; }
.hud button { width:30px; height:30px; border-radius:7px; background:var(--bg-panel);
  border:1px solid var(--border-default); color:var(--text-secondary); font-size:13px; }
.hud button:hover { color:var(--text-primary); border-color:var(--accent); }
.hud .zl { font-size:11px; text-align:center; color:var(--text-tertiary); height:16px; }
.canvas-empty { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); text-align:center;
  color:var(--text-tertiary); pointer-events:none; }
.canvas-empty .big { font-size:34px; margin-bottom:10px; opacity:.8; }
.canvas-empty kbd { background:var(--bg-elevated); border:1px solid var(--border-default);
  border-radius:4px; padding:1px 7px; font-size:11px; }

/* ---------- inspector ---------- */
.inspector { grid-area:inspector; background:var(--bg-panel); border-left:1px solid var(--border-subtle);
  overflow-y:auto; padding:14px; min-height:0; }
.inspector h3 { font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-tertiary);
  margin-bottom:10px; }
.inspector .field { margin-bottom:12px; }
.inspector label { display:block; font-size:11px; color:var(--text-secondary); margin-bottom:4px; }
.inspector textarea { width:100%; background:var(--bg-base); color:var(--text-primary);
  border:1px solid var(--border-default); border-radius:6px; padding:7px 9px; font-size:12px;
  min-height:64px; resize:vertical; }
.inspector textarea:focus { outline:none; border-color:var(--accent); }
.inspector input[type="text"] { width:100%; height:34px; background:var(--bg-base); color:var(--text-primary);
  border:1px solid var(--border-default); border-radius:7px; padding:0 9px; font-size:12px; }
.inspector input[type="text"]:focus { outline:none; border-color:var(--accent); }
.workspace-colors { display:grid; grid-template-columns:repeat(6,1fr); gap:7px; }
.workspace-color { aspect-ratio:1; border-radius:7px; background:var(--swatch); border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); }
.workspace-color:hover,.workspace-color.on { border-color:#fff; box-shadow:0 0 0 2px var(--swatch); }
.inspector .btn { width:100%; justify-content:center; }
.ins-empty { color:var(--text-tertiary); font-size:12px; line-height:1.9; }
.fb-item { background:var(--bg-elevated); border:1px solid var(--border-subtle); border-radius:7px;
  padding:8px 10px; margin-bottom:7px; font-size:11.5px; }
.fb-item .rev { color:var(--cyan); font-weight:700; margin-right:6px; }
.fb-item .sug { color:var(--text-secondary); font-size:11px; margin-top:3px; }
.kv { display:flex; justify-content:space-between; font-size:11.5px; padding:4px 0;
  border-bottom:1px dashed var(--border-subtle); }
.kv span:first-child { color:var(--text-tertiary); } .kv span:last-child { color:var(--text-primary); }

/* ---------- 当前工作区状态 ---------- */
.timeline { grid-area:timeline; background:var(--bg-panel); border-top:1px solid var(--border-subtle);
  display:flex; align-items:center; padding:0 24px; overflow-x:auto; }
.tl-title { font-size:11px; color:var(--text-tertiary); letter-spacing:.1em; text-transform:uppercase;
  margin-right:22px; white-space:nowrap; }
.tl-stage { display:flex; align-items:center; flex:1; min-width:120px; }
.tl-dot { width:24px; height:24px; border-radius:50%; background:var(--bg-base); border:2px solid var(--border-default);
  display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-tertiary);
  flex:none; transition:all .25s; }
.tl-stage.done .tl-dot { border-color:var(--success); color:var(--success); }
.tl-stage.active .tl-dot { border-color:var(--accent); color:#fff; background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft); }
.tl-label { margin-left:9px; font-size:12px; color:var(--text-tertiary); white-space:nowrap; }
.tl-stage.active .tl-label, .tl-stage.done .tl-label { color:var(--text-primary); }
.tl-line { flex:1; height:2px; background:var(--border-default); margin:0 12px; min-width:24px; }
.tl-line.done { background:var(--success); }
.tl-status { margin-left:auto; font-size:11.5px; color:var(--text-secondary); white-space:nowrap; }
.tl-status.ok { color:var(--success); }
.mobile-only { display:none; }
.mobile-scrim { display:none; position:fixed; inset:46px 0 58px; z-index:70; background:rgba(0,0,0,.55); backdrop-filter:blur(2px); }
.mobile-scrim.on { display:block; }
.preview-modal { position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:28px;
  background:rgba(3,3,8,.76); backdrop-filter:blur(12px); }
.preview-modal[hidden] { display:none; }
.preview-dialog { width:min(1180px,94vw); height:min(780px,90vh); display:grid; grid-template-rows:48px 1fr;
  background:var(--bg-panel); border:1px solid var(--border-strong); border-radius:14px; overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.58); }
.preview-bar { display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid var(--border-subtle); }
.preview-bar strong { font-size:13px; } .preview-bar span { color:var(--text-tertiary); font-size:11px; }

const miniOf = (kind, id) => `<div class="mini">${(kind === 'page' ? PAGE_MINI : MINI)[id] || ''}</div>`;

/* ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let camera = { x:0, y:0, z:1 };
let nodes = [], edges = [], selected = null, uid = 1, wsSeq = 1, activeWorkspaceId = null;
let workspaceNavigatorCollapsed = false;
const WORKSPACE_COLORS = [
  { hex:'#5B8DEF', tint:'rgba(91,141,239,.07)' },
  { hex:'#27A87D', tint:'rgba(39,168,125,.07)' },
  { hex:'#E07A3F', tint:'rgba(224,122,63,.07)' },
  { hex:'#C45C8A', tint:'rgba(196,92,138,.07)' },
  { hex:'#8A72D8', tint:'rgba(138,114,216,.07)' },
  { hex:'#B38A2E', tint:'rgba(179,138,46,.07)' },
];
const worldEl = $('#world'), nodesEl = $('#nodes'), edgesEl = $('#edges'), viewport = $('#viewport');
const guideX = $('#guide-x'), guideY = $('#guide-y');
const state = { templates: [], projects: [], alliance: [] };
const canvasEngine = FoxCanvasEngine.create({ viewport, getCamera:() => camera, getNodes:() => nodes,
  guideX, guideY, getNodeElement:id => document.getElementById('node-' + id) });
let deferredInstallPrompt = null;

function closeMobilePanels() {
  $('#sidebar').classList.remove('mobile-open');
  $('#inspector').classList.remove('mobile-open');
  $('#mobile-scrim').classList.remove('on');
}
function toggleMobilePanel(id) {
  const panel = $('#' + id);
  const opening = !panel.classList.contains('mobile-open');
  closeMobilePanels();
  if (opening) { panel.classList.add('mobile-open'); $('#mobile-scrim').classList.add('on'); }
}
function updateConnectionStatus() {
  const status = $('#status');
  if (!navigator.onLine) { status.textContent = '离线：工作区可编辑，生成需连接本地服务'; status.classList.remove('ok'); }
}
window.addEventListener('online', () => { $('#status').textContent = ''; });
window.addEventListener('offline', updateConnectionStatus);
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstallPrompt = e; $('#btn-install').hidden = false;
});
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; $('#btn-install').hidden = true; });
window.addEventListener('pagehide', () => {
  try { fetch('/api/workspace', { method:'PUT', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(workspaceSnapshot()), keepalive:true }); } catch(e) {}
});

let remoteSaveTimer = null, restoringWorkspace = false, remoteSaveFailed = false;
function workspaceSnapshot() {
  return { schema_version:1, saved_at:new Date().toISOString(),
    canvas:{ camera, nodes, edges, uid, wsSeq, activeWorkspaceId, workspaceNavigatorCollapsed } };
}
function normalizeWorkspaceState() {
  const workspaces = nodes.filter(n => n.kind === 'ws');
  workspaces.forEach((ws, index) => {
    ws.data = ws.data || {};
    ws.title = ws.data.title || ws.title || `工作区 ${index + 1}`;
    ws.data.title = ws.title;
    ws.data.color = ws.data.color || WORKSPACE_COLORS[index % WORKSPACE_COLORS.length].hex;
    ws.data.tint = ws.data.tint || workspaceColor(ws.data.color).tint;
  });
  for (const node of nodes.filter(n => n.kind !== 'ws')) {
    if (node.workspaceId && !workspaces.some(ws => ws.id === node.workspaceId)) node.workspaceId = null;
    if (!node.workspaceId) node.workspaceId = workspaceAtNode(node)?.id || null;
  }
  if (!workspaces.some(ws => ws.id === activeWorkspaceId)) activeWorkspaceId = workspaces[0]?.id ?? null;
}
function applyWorkspaceSnapshot(snapshot) {
  const canvas = snapshot && (snapshot.canvas || snapshot);
  if (!canvas || !Array.isArray(canvas.nodes) || !Array.isArray(canvas.edges)) return false;
  restoringWorkspace = true;
  camera = canvas.camera || { x:0, y:0, z:1 }; nodes = canvas.nodes; edges = canvas.edges;
  uid = canvas.uid || (Math.max(0, ...nodes.map(n => Number(n.id) || 0)) + 1); wsSeq = canvas.wsSeq || 1;
  activeWorkspaceId = canvas.activeWorkspaceId ?? null;
  workspaceNavigatorCollapsed = Boolean(canvas.workspaceNavigatorCollapsed);
  normalizeWorkspaceState();
  restoringWorkspace = false;
  return true;
}
async function persistWorkspaceNow() {
  clearTimeout(remoteSaveTimer);
  const result = await api('/api/workspace', 'PUT', workspaceSnapshot());
  remoteSaveFailed = false;
  return result;
}
function save() {
  const snapshot = workspaceSnapshot();
  localStorage.setItem('fox-canvas-v3', JSON.stringify(snapshot));
  if (restoringWorkspace) return;
  clearTimeout(remoteSaveTimer);
  remoteSaveTimer = setTimeout(async () => {
    try { await api('/api/workspace', 'PUT', snapshot); remoteSaveFailed = false; }
    catch (e) {
      if (!remoteSaveFailed) { $('#status').textContent = '云端快照未保存：' + e.message; remoteSaveFailed = true; }
    }
  }, 650);
}
function loadSaved() {
  try { return applyWorkspaceSnapshot(JSON.parse(localStorage.getItem('fox-canvas-v3'))); } catch(e) {}
  return false;
}
async function loadRemoteWorkspace() {
  try {
    const data = await api('/api/workspace');
    if (!data.exists || !applyWorkspaceSnapshot(data.state)) return false;
    localStorage.setItem('fox-canvas-v3', JSON.stringify(data.state));
    flash(data.recovered ? '已从备份恢复工作区' : '已从服务端恢复工作区', true);
    return true;
  } catch(e) { return false; }
}
function applyCamera(commit = true) {
  worldEl.style.transform = `translate3d(${camera.x}px,${camera.y}px,0) scale(${camera.z})`;
  $('#zoom-label').textContent = Math.round(camera.z * 100) + '%';
  if (commit) save();
}
function toWorld(e) { return canvasEngine.screenToWorld(e.clientX, e.clientY); }
let viewportCommitTimer = null;
function scheduleViewportCommit() {
  clearTimeout(viewportCommitTimer); viewportCommitTimer = setTimeout(save, 180);
}
function zoomBy(f, cx, cy) {
  const r = viewport.getBoundingClientRect();
  cx = cx ?? r.width / 2; cy = cy ?? r.height / 2;
  const wx = (cx - camera.x) / camera.z, wy = (cy - camera.y) / camera.z;
  camera.z = Math.min(2.4, Math.max(0.25, camera.z * f));
  camera.x = cx - wx * camera.z; camera.y = cy - wy * camera.z;
  applyCamera(false); scheduleViewportCommit();
}
function fitRect(x, y, w, h, pad = 90) {
  const r = viewport.getBoundingClientRect();
  const safeW = Math.max(1, w), safeH = Math.max(1, h);
  const z = Math.max(0.25, Math.min(1.5, Math.min((r.width - pad*2) / safeW, (r.height - pad*2) / safeH)));
  camera.z = z; camera.x = (r.width - safeW * z) / 2 - x * z; camera.y = (r.height - safeH * z) / 2 - y * z;
  applyCamera();
}
function fitAll() {
  const vis = nodes.filter(n => n.kind !== 'ws');
  if (!vis.length) { camera = {x:viewport.clientWidth/2,y:viewport.clientHeight/2,z:1}; return applyCamera(); }
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for (const n of vis) { const size=canvasEngine.nodeSize(n); x1=Math.min(x1,n.x); y1=Math.min(y1,n.y);
    x2=Math.max(x2,n.x+size.width); y2=Math.max(y2,n.y+size.height); }
  fitRect(x1,y1,x2-x1,y2-y1);
}
function resetView() { fitAll(); }
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) { const r=viewport.getBoundingClientRect(); zoomBy(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top); }
  else { camera.x-=e.deltaX; camera.y-=e.deltaY; applyCamera(false); scheduleViewportCommit(); }
}, {passive:false});

  nodes.push(n); renderNode(n);

/* ================= 工作区 ================= */
function workspaceColor(hex) {
  const known = WORKSPACE_COLORS.find(item => item.hex.toLowerCase() === String(hex || '').toLowerCase());
  if (known) return known;
  const clean = String(hex || '#5B8DEF').replace('#','');
  const value = clean.length === 3 ? clean.split('').map(char => char + char).join('') : clean.padEnd(6,'0').slice(0,6);
  const red = parseInt(value.slice(0,2),16), green = parseInt(value.slice(2,4),16), blue = parseInt(value.slice(4,6),16);
  return { hex:'#' + value, tint:`rgba(${red},${green},${blue},.07)` };
}
function applyWorkspaceAppearance(ws, element = document.getElementById('node-' + ws.id)) {
  if (!element) return;
  const color = workspaceColor(ws.data?.color);
  element.style.setProperty('--workspace-color', color.hex);
  element.style.setProperty('--workspace-tint', ws.data?.tint || color.tint);
}
function workspaceAtNode(node) {
  const width = Number(node.w) || (node.kind === 'output' || node.kind === 'file' ? 430 : 226);
  const height = Number(node.h) || 120;
  const centerX = node.x + width / 2, centerY = node.y + Math.min(height / 2, 72);
  return nodes.find(candidate => candidate.kind === 'ws' && candidate.id !== node.id &&
    centerX >= candidate.x && centerX <= candidate.x + candidate.w &&
    centerY >= candidate.y && centerY <= candidate.y + candidate.h) || null;
}
function workspaceForNode(node) {
  if (!node) return null;
  if (node.kind === 'ws') return node;
  return nodes.find(ws => ws.kind === 'ws' && ws.id === node.workspaceId) || workspaceAtNode(node);
}
function activeWorkspace() {

}
function addWorkspace() {

}

  list.innerHTML = workspaces.map(ws => {

      <button class="workspace-nav-main" onclick="focusWorkspace(${ws.id})" ondblclick="quickRenameWorkspace(${ws.id})" style="--workspace-color:${color.hex}">

  return nodes.filter(node => {

    if (!includeOutputs && node.kind === 'output') return false;
    if (node.workspaceId === ws.id) return true;
    return !node.workspaceId && workspaceAtNode(node)?.id === ws.id;

/* ================= 推进流水线（拆解 → 组合 → 生成） ================= */
async function advanceActive() {
  const ws = activeWorkspace();
  if (!ws) return flash('画布上还没有工作区 — 点 HUD 的 ▣ 新建', false);
  advanceWs(ws.id);
}
async function advanceWs(wsId) {
  const ws = nodes.find(n => n.id === wsId);
  if (!ws) return;
  activeWorkspaceId = ws.id; renderWorkspaceNavigator(); timeline();
  const members = membersOf(ws);
  const req = members.find(n => n.kind === 'requirement') || members.find(n => n.kind === 'note');
  const btn = document.getElementById('ws-go-' + wsId);
  if (!req || !(req.data.text || '').trim()) {
    return flash('工作区里需要一个「需求」节点并写一句话（侧栏「内容」页第一个卡片）', false);
  }
  btn && (btn.disabled = true, btn.textContent = '… 推进中');
  try {
    /* 阶段 1 · 需求拆解 */
    setAn(req, `<span class="spin">拆解中…</span>`);
    const an = await post('/api/analyze', { prompt: req.data.text });
    req.data.analysis = an;
    setAn(req, anChips(an));
    flash(`拆解 ✓ ${INTENT_LABEL[an.intent]} · 风格 ${an.preset_id} · 置信度 ${an.confidence}`, true);

    /* 阶段 2 · 自动组合工作区素材 */
    /* 类型语义：需求拆解置信度高 → 跟随需求；否则跟随工作区版式节点 */
    const tplNode = members.find(n => n.kind === 'template');
    let intent = (tplNode && tplNode.data.intent) || an.intent;
    if (tplNode && tplNode.data.intent !== an.intent && (an.intent_confidence || 0) >= 0.55) {
      intent = an.intent;
      flash(`需求指向${INTENT_LABEL[an.intent]}，已按需求类型生成（版式配方继续生效）`, true);
    }
    const styleNode = members.find(n => n.kind === 'style');
    const colorNode = members.find(n => n.kind === 'color');
    const fontNode = members.find(n => n.kind === 'font');
    const blockTexts = members.filter(n => n.kind === 'block').map(n => (n.data.text || '').trim()).filter(Boolean);
    const body = {
      prompt: [req.data.text.trim(), ...blockTexts].join('\n'),
      intent,
      template: (tplNode && tplNode.data.template) || (styleNode && styleNode.data.preset) || null,
      primary: colorNode && colorNode.data.hex,
      font: fontNode && fontNode.data.font,
      quiet_llm: false,
    };

    /* 阶段 3 · 异步生成 */
    const submitted = await api('/api/jobs', 'POST', body);
    const d = await waitForJob(submitted.job.id, job => {
      const pct = Number(job.progress || 0);
      btn && (btn.textContent = '… 生成 ' + pct + '%');
      flash('任务 ' + job.id.slice(0, 8) + ' · ' + job.stage + ' · ' + pct + '%', true);
    });
    const out = addNode('output', ws.x + ws.w + 80, ws.y + 30,
      { workspaceId:ws.id, title: INTENT_LABEL[d.intent] + ' · 产物', preview_url: d.preview_url, project: d.project,
        project_name: d.project_name, intent: d.intent, preset_id: d.preset_id, revision: 0, feedback: [] });

function apiErrorMessage(data, status) {
  if (typeof data?.error === 'string') return data.error;
  return data?.error?.message || data?.message || ('请求失败（HTTP ' + status + '）');
}
async function api(url, method='GET', data=null) {
  const options = { method, headers:{} };
  if (data !== null) { options.headers['Content-Type'] = 'application/json'; options.body = JSON.stringify(data); }
  const response = await fetch(url, options);
  let result = {};
  try { result = await response.json(); } catch(e) {}
  if (!response.ok || result.ok === false) {
    const requestId = result.request_id ? ' · ' + result.request_id : '';
    throw new Error(apiErrorMessage(result, response.status) + requestId);
  }
  return result;
}

    if (job.status === 'failed') throw new Error(job.error?.message || '生成任务失败');
    if (job.status === 'cancelled') throw new Error('生成任务已取消');
    await delay(450);
  }
}

      const settled=canvasEngine.settleNode(n);n.x=settled.x;n.y=settled.y;placeNode(n);
    }
    $('#empty-hint').style.display = 'none';
    updateWsCount(); save();
  } catch (err) {}
});

/* ================= 当前工作区进度 ================= */
const STAGES = ['素材配方', '视觉风格', '需求说明', '需求拆解', '生成产物'];
function timeline() {
  const ws = activeWorkspace();
  if (!ws) {
    $('#tl-title').textContent = '当前工作区'; $('#tl-stages').innerHTML = '';
    $('#tl-status').textContent = '新建工作区后开始创作'; return;
  }
  const recipe = membersOf(ws);
  const artifacts = membersOf(ws, { includeOutputs:true });
  const requirement = recipe.find(n => n.kind === 'requirement' || n.kind === 'note');
  const done = [
    recipe.some(n => n.kind === 'block' || n.kind === 'template'),
    recipe.some(n => n.kind === 'style' || n.kind === 'color' || n.kind === 'font' || n.kind === 'template'),
    Boolean(requirement && String(requirement.data?.text || '').trim()),
    Boolean(requirement?.data?.analysis),
    artifacts.some(n => n.kind === 'output'),
  ];
  const active = done.indexOf(false);
  $('#tl-title').textContent = ws.title;
  $('#tl-status').textContent = `${recipe.length} 素材 · ${artifacts.filter(n=>n.kind==='output').length} 产物`;
  $('#tl-stages').innerHTML = done.map((d, i) => `
    ${i ? `<div class="tl-line ${done[i - 1] ? 'done' : ''}"></div>` : ''}
    <div class="tl-stage ${d ? 'done' : i === active ? 'active' : ''}">
      <div class="tl-dot">${d ? '✓' : i + 1}</div><div class="tl-label">${STAGES[i]}</div></div>`).join('');
}

/* ================= 数据加载 & 初始化 ================= */
async function loadProjects() {
  try { state.projects = (await api('/api/projects')).items; } catch(e) { flash('项目列表加载失败：' + e.message, false); }
  if (activeTab === 'files') renderPalette();
}
async function loadAlliance() {
  try { state.alliance = (await api('/api/alliance')).items; } catch(e) {}
  if (activeTab === 'skills') renderPalette();
}
async function loadTemplates() {
  try { state.templates = (await api('/api/templates')).items; } catch(e) {}
  if (activeTab === 'styles') renderPalette();
}
async function init() {
  updateConnectionStatus();
  const installBtn = $('#btn-install');
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (isIos && !isStandalone) installBtn.hidden = false;
  installBtn.addEventListener('click', async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null; installBtn.hidden = true;
    } else {
      alert('iPhone / iPad：请点浏览器“分享”，再选择“添加到主屏幕”。');
    }
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  try { const h = await (await fetch('/api/health')).json(); $('#ver').textContent = 'v' + h.version; } catch(e) {}
  await Promise.all([loadTemplates(), loadProjects(), loadAlliance()]);
  let restored = loadSaved();
  if (!restored) restored = await loadRemoteWorkspace();
  if (restored) {
    nodesEl.innerHTML = '';
    nodes.forEach(renderNode); drawEdges(); applyCamera();
    $('#empty-hint').style.display = nodes.length ? 'none' : '';
  } else {
    // 首次进入：预置 PPT 模板工作区（主要内容形态：HTML 载体的 PPT/文档优先）
    const ws = addNode('ws', 40, 60, { title:'工作区 1 · 我的 PPT 模板' });
    const req = addNode('requirement', 90, 130, { title:'需求' });
    req.data.text = '做一个发布会 PPT，主题是狐构 AI 创作工具，深色风格';
    const t = document.getElementById('node-' + req.id); t.querySelector('textarea').value = req.data.text;
    const tpl = addNode('template', 90, 330, { title:'发布会 PPT', intent:'deck' });
    const st = addNode('style', 350, 130, { title: state.templates[1]?.name || 'Vercel 深色',
      preset: state.templates[1]?.id || 'vercel-dark',
      swatches: state.templates[1] ? [state.templates[1].tokens.bg, state.templates[1].tokens.primary, state.templates[1].tokens.accent]
                                   : ['#0A0A0B', '#4F46E5', '#22D3EE'] });
    const cover = addNode('block', 350, 330, { title:'章节封面', blockId:'cover' });
    select(null);
    $('#empty-hint').style.display = 'none';
  }
  renderPalette(); renderWorkspaceNavigator(); timeline(); updateWsCount();
  if (!restored) setTimeout(fitAll, 120);
}
init();
</script>
