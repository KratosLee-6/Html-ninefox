[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htmlninefox"
version = "0.7.1"
description = "Html九尾狐 · 本地优先的可视化 HTML 创作工作台（v0.7.0 网页反向拆解 + v0.6.0 设计吸收 + 可编辑 PPTX）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "KratosLee · Html九尾狐项目组" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "playwright>=1.40,<2",
]

[project.optional-dependencies]
templates = ["jinja2>=3.1"]
# LLM 增强（可选）：无 Key 时自动走离线规则引擎，功能不缺失
llm = ["litellm>=1.40.0"]
# cryptography is not optional decoration: tests/test_ssrf_tls_pinning.py builds
# a real certificate and opens a real socket with it, so that gate can see SNI
# and peer verification actually happen. Without this, CI cannot import it and
# the whole test file errors out — which is how the TLS pinning gate shipped
# without ever having run in CI. It deliberately does not skip on ImportError.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "python-pptx>=0.6.23", "cryptography>=41.0"]
packaging = ["pyinstaller>=6.0,<7"]
pptx = ["python-pptx>=0.6.23"]

[project.scripts]
htmlninefox = "htmlninefox.cli:main"
htmlninefox-desktop = "htmlninefox.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["htmlninefox*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
htmlninefox = ["data/alliance/*.yaml", "example/*.yaml", "templates/*.html", "server/static/*.html", "server/static/*.js", "server/static/*.css", "server/static/*.svg", "server/static/*.webmanifest", "templates/gallery/*.html", "templates/gallery/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["release", ".codex_tmp", ".git"]
