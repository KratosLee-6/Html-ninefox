<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九尾狐 · 像素花园直播海报</title><style>:root{--bg:#160B26;--surface:#241239;--text:#FFF7ED;--muted:#C4B5FD;--primary:#F43F5E;--accent:#FACC15;--border:#3B1358;--radius:16px;--sans:'Inter','PingFang SC','Microsoft YaHei',sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(var(--muted) .5px,transparent .5px);background-size:9px 9px}.deck{height:100%;position:relative}.page{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:6vh 6vw;opacity:0;transform:translateY(24px);pointer-events:none;transition:.4s ease}.page.on{opacity:1;transform:none;pointer-events:auto}.chrome,.foot{display:flex;justify-content:space-between;align-items:center;font:700 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.kicker{display:inline-block;font:800 13px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:9px 16px;border-radius:999px}.display{font-size:clamp(46px,7.5vw,132px);line-height:.96;letter-spacing:-.03em;font-weight:900;margin:2.6vh 0 0}.display em{font-style:normal;color:var(--primary)}.sub{font-size:clamp(16px,1.7vw,26px);line-height:1.65;color:var(--muted);max-width:28em;margin:2.8vh 0 0}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:3.6vh}.meta div{background:var(--surface);padding:2.2vh 1.6vw}.meta b{display:block;font:800 11px/1 var(--sans);letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:1.2vh}.meta span{font-size:clamp(14px,1.4vw,20px);font-weight:700}.nav{position:fixed;right:22px;bottom:20px;z-index:9;display:flex;gap:6px}.nav button{width:36px;height:36px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:700 15px var(--sans);border-radius:10px;cursor:pointer}.counter{position:fixed;left:22px;bottom:22px;z-index:9;font:700 12px var(--sans);letter-spacing:.14em;color:var(--muted)}</style></head><body><div class="deck"><section class="page" data-page="poster"><div class="chrome"><span>九尾狐 · 直播海报</span><span>LIVE</span></div><main><span class="kicker">线上直播 · 免费报名</span><h1 class="display">像素花园<br><em>夜谈</em>第一期</h1><p class="sub">从一张空白画布开始，现场把三份完全不同的素材做成三张页面——观众点单，当场做。</p><div class="meta"><div><b>时间</b><span>11 月 21 日 20:00</span></div><div><b>形式</b><span>直播 + 回放</span></div><div><b>对象</b><span>内容 / 运营同学</span></div></div></main><div class="foot"><span>九尾狐 · 直播海报 原创模板</span><span>主视觉</span></div></section><section class="page" data-page="details"><div class="chrome"><span>九尾狐 · 直播海报</span><span>AGENDA</span></div><main><span class="kicker">当晚流程</span><h1 class="display">三份素材<br><em>三张</em>页面</h1><div class="meta" style="grid-template-columns:1fr"><div><b>看点</b><span>同一份 brief 在三种意图下的完全不同长相——你会看到「内容类型」这四个字到底意味着什么。</span></div></div></main><div class="foot"><span>九尾狐 · 直播海报 原创模板</span><span>流程</span></div></section></div><div class="counter"></div><nav class="nav"><button data-prev aria-label="上一页">←</button><button data-next aria-label="下一页">→</button></nav><script>(()=>{const pages=[...document.querySelectorAll('.page')],counter=document.querySelector('.counter');let index=0;function show(next){index=(next+pages.length)%pages.length;pages.forEach((page,i)=>page.classList.toggle('on',i===index));counter.textContent=String(index+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0')}document.querySelector('[data-prev]').onclick=()=>show(index-1);document.querySelector('[data-next]').onclick=()=>show(index+1);addEventListener('keydown',event=>{if(['ArrowRight','PageDown',' '].includes(event.key))show(index+1);if(['ArrowLeft','PageUp'].includes(event.key))show(index-1)});show(0)})();</script></body></html>
