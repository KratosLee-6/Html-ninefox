    notes: CSS 动效预设参考；提取时长/缓动模式，生成物为原创实现

  # ---- 字体（typography）----
  - id: google-fonts
    name: Google Fonts
    kind: typography
    license_class: open
    entry_url: https://fonts.google.com/
    rate_limit: { requests_per_minute: 8 }
    notes: 开源字体（OFL/Apache）；字体栈可直接入库
  - id: fontshare
    name: Fontshare
    kind: typography
    license_class: open
    entry_url: https://www.fontshare.com/
    rate_limit: { requests_per_minute: 8 }
