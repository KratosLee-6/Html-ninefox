name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The release metadata gate reads the GitHub API through `gh`, and `gh`
      # refuses to call anything unauthenticated even on a public repository.
      # Without this the gate fails here rather than skipping — which is the
      # point of it, and is also why it named this exact variable when it did.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      # setuptools and wheel are not optional here: the package payload gates
      # build a real wheel through setuptools' own PEP 517 backend. Without
      # them those two tests die at setup, which is the same shape as the
      # cryptography gap fixed in fae38fe — a gate that cannot run in CI is
      # worse than one that fails, because locally it passes.
      - run: python -m pip install -e ".[dev]" setuptools wheel
      - name: Release metadata consistency
        run: python scripts/check_release_version.py
      - name: DeepSeek Harness plugin integration
        working-directory: integrations/deepseek-harness
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - run: python -m playwright install --with-deps chromium
      - name: Python and browser test suite
        run: python -m pytest tests -q -p no:cacheprovider --tb=short -rf --junitxml=pytest-report.xml
      # The fetcher's production shape — no resolver injected — shipped broken
      # from v0.6.2 through v0.6.4 while every test that injected a resolver
      # stayed green. The gate drives the shape _api_intake_fetch actually
      # calls; this mutation proves removing the default turns it red.
      - name: Mutation check — the fetch must succeed as production calls it
        run: python scripts/mutate_fetch_production_gates.py
      - name: JavaScript syntax
        run: |
          node --check htmlninefox/server/static/canvas-engine.js
          node --check htmlninefox/server/static/canvas-productivity.js
          node --check htmlninefox/server/static/workbench-features.js
          node --check htmlninefox/server/static/workbench-ui.js
          node --check htmlninefox/server/static/motion-system.js
          node --check htmlninefox/server/static/interaction-system.js
          node --check htmlninefox/server/static/lifecycle-projects.js
          node --check htmlninefox/server/static/lifecycle-generation.js
          node --check htmlninefox/server/static/lifecycle-revisions.js
          node --check htmlninefox/server/static/lifecycle-exports.js
          node --check htmlninefox/server/static/lifecycle-intake.js
          node --check htmlninefox/server/static/lifecycle-slides.js
          node --check htmlninefox/server/static/sw.js
          python scripts/check_inline_js.py
      - name: Chromium acceptance
        run: python e2e_verify.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: htmlninefox-test-evidence
          path: |
            e2e-shots/*.png
            e2e-output/**/.foxstate.json
            pytest-report.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Success-path smoke, kept separate from the main suite on purpose.
  #
  # v0.6.0 shipped a portable package that passed four build jobs and the whole
  # suite, then crashed on start. v0.6.2 shipped a fetcher that raised on every
  # request while five CI jobs, 39 byte-verified release assets and the metadata
  # gate all passed. Both times the suite could observe a *refusal* but never a
  # *success*, so "correctly refused" and "completely broken" were the same
  # signal.
  #
  # This job runs the smoke suite and then mutation-tests it: each production
  # path is deliberately broken and the suite must go red. A green run here
  # means the suite can actually see a working feature, not just a rejected
  # one. The mutation step is the part that makes the job meaningful — without
  # it this would be yet another set of tests that would pass on broken code.
  smoke-success-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pptx]"
      - name: Success-path smoke
        run: >
          python -m pytest tests/test_smoke_success_paths.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the smoke must fail on broken code
        run: python scripts/mutate_smoke_gates.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: htmlninefox-smoke-evidence
          path: |
            ${{ runner.temp }}/htmlninefox-mutation/
          if-no-files-found: ignore

  # The front-end kernel was an 81k inline <script> until the C7 first step, so
  # nothing could unit test it. It now loads as a real file, which makes two
  # failure modes testable: the script chain throwing on load, and STATIC_FILES
  # serving the wrong bytes for a script the page asks for. The second is the
  # v0.6.0-shaped trap — the file ships, the whitelist forgets it, the page goes
  # blank and every other job stays green. The mutation step is what proves these
  # gates can see that; without it they would just be four more green tests.
  frontend-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Front-end kernel gates
        run: >
          python -m pytest tests/test_frontend_kernel_loadable.py
          tests/test_action_registry.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the kernel gates must fail on broken code
        run: python scripts/mutate_frontend_kernel_gates.py

  # workbench-features.js used to execute thirteen statements at load time, so
  # it could not be loaded on its own and index.html's script order was a hard
  # constraint. It now has declarations only, which is what lets its pure
  # functions be unit tested by feeding them a fake state in node.
  #
  # The mutation step matters more here than usual: the first run of this
  # mutation script came back 6/10, and two of the four misses were gates that
  # looked fine and asserted nothing about the property they claimed.
  c7-extension-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" setuptools wheel cryptography
      - name: Extension layer gates
        run: >
          python -m pytest tests/test_workbench_features_pure.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the layer must fail on a top-level side effect
        run: python scripts/mutate_c7_gates.py

  # Three releases in a row went out with assets that had never been downloaded
  # on the machine that built them; "verified" meant the digest file's name
  # matched the asset's name. Deep verification of a 100MB archive does not
  # belong on every push, but the part that is cheap and always true — the
  # release is *checkable* — does.
  #
  # GH_TOKEN is not optional here. The gate fails rather than skips when it
  # cannot reach the API, because a gate that quietly does nothing in CI is the
  # exact failure mode this repository keeps having to fix after the fact.
  release-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Release asset metadata
        run: >
          python -m pytest tests/test_release_asset_metadata.py
          -q -p no:cacheprovider --tb=short -rf

  # The two node-removal sites reassign `nodes = nodes.filter(...)` rather than
  # deleting in place. That is correct today, and C7's next step is to change
  # it. These gates are the thing the change has to fail against: after a
  # removal, `nodes`, `edges` and the persisted snapshot must all agree. If one
  # of them keeps the old array the views diverge silently — deleted nodes still
  # counted, still persisted, still drawn — and nothing throws.
  node-removal:
    name: Node removal observers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" setuptools wheel cryptography
      - name: Node removal gates
        run: >
          python -m pytest tests/test_nodes_removal_observers.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — every holder must be able to disagree
        run: python scripts/mutate_nodes_removal_gates.py

  # Three things the v0.7 groundwork found, each of which was a live problem:
  # the block vocabulary is written down three times with nothing keeping them
  # in sync; a page's palette never reached the page the user generates; and
  # composition["blocks"] flattened any structured block into its repr.
  page-foundation:
    name: Page decomposition foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" setuptools wheel cryptography
      - name: Page foundation gates
        run: >
          python -m pytest
          tests/test_block_vocabulary_copies.py
          tests/test_user_template_style_reaches_page.py
          tests/test_page_sections_reach_output.py
          tests/test_page_blocks_from_candidate.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the block vocabulary must not drift
        run: python scripts/mutate_block_vocabulary_gates.py
      - name: Hand-maintained lists must not drift
        run: >
          python -m pytest tests/test_hand_maintained_lists.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — each past list-drift incident replayed
        run: python scripts/mutate_hand_maintained_lists_gates.py
      - name: Mutation check — a page's sections must survive to the document
        run: python scripts/mutate_page_blocks_gates.py
      - name: Mutation check — a page's palette must reach the page
        run: python scripts/mutate_user_template_style_gates.py
      # The licence rule existed in two copies and they disagreed about
      # `reference`: structure-only on the block path, whole body copied into the
      # template gallery on the approve path. A licence meaning "reference it,
      # do not copy it" was being copied. The gates assert the two answers match
      # rather than asserting each path separately, so a fourth licence exposes
      # the disagreement instead of widening both copies.
      - name: The licence rule must be one rule
        run: >
          python -m pytest tests/test_licence_rule_is_one_rule.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the two paths must not drift apart
        run: python scripts/mutate_licence_rule_gates.py
      - name: Mutation check — a page's sections must survive the pipeline
        run: python scripts/mutate_page_sections_gates.py
      # Only `doc` consumed the block channel. Measured before this gate: a
      # page's sections gave landing 0 body characters, archdoc 26 (its shell
      # alone), and dashboard/deck/poster silently rendered the built-in copy.
      # 526 tests stayed green throughout, so "the tests pass" proved nothing
      # about whether a page could become a project.
      - name: A page's own sections must reach every intent
        run: >
          python -m pytest tests/test_page_sections_reach_every_intent.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the opt-in must be load-bearing in all six
        run: python scripts/mutate_page_sections_every_intent_gates.py

  # Does what the product actually ships carry the front end? A file can be
  # written, committed, referenced by the page and still be absent from the
  # wheel, because setuptools package-data is a hand-written allowlist. That is
  # the v0.6.0 shape: green everywhere, broken once installed.
  #
  # This is cheap (about 2s to build the wheel) so it runs on every push. The
  # same check is repeated in build-release-packages.yml, which is where it
  # gates publishing; having it here means the problem is found at the commit
  # rather than at the release.
  package-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" setuptools wheel
      - name: Package payload gates
        run: >
          python -m pytest tests/test_package_payload.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the payload gates must fail on a broken package
        run: python scripts/verify_package_payload.py --mutate

  # The layer the other jobs cannot see: does clicking a control actually make
  # the product do something? The v0.6.0 missing-PPTX option and the v0.6.1 slide
  # race both lived in the browser, where the server-side suite is blind.
  #
  # Separate from pytest-and-browser because it carries a mutation step, and the
  # mutation step is the point: a dead button (onclick naming a function the
  # dispatch table does not have) is invisible to every other job here. Eight
  # mutations break the wiring the way it breaks in production and each must
  # turn a test red.
  ui-e2e-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pptx]"
      - run: python -m playwright install --with-deps chromium
      - name: UI behaviour smoke
        run: >
          python -m pytest tests/test_ui_e2e_smoke.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the UI gates must fail on a dead control
        run: python scripts/mutate_ui_gates.py
      # e2e_verify.py used to mkdir and overwrite assets/screenshots/v<version>/
      # on every run — a published release directory that README links to. A
      # plain "run the acceptance script" would silently rewrite shipped assets
      # in the working tree. These gates import the real module in a subprocess
      # and assert where RELEASE_SHOTS actually resolves to.
      - name: Running the e2e must not rewrite published release screenshots
        run: >
          python -m pytest tests/test_e2e_release_shots_are_opt_in.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the opt-in must be load-bearing
        run: python scripts/mutate_e2e_release_shots_gates.py
      # This one shipped a real incident: the push script read each file from
      # the working tree, so a dirty tree published the NEXT commit's CI change
      # inside the PREVIOUS one. Six of seven files were correct, so nothing
      # looked wrong until the following push refused with a message about
      # history. The gates drive the real code against a repo whose tree is
      # deliberately dirtier than the commit being pushed.
      - name: A push must publish the commit, not the working tree
        run: >
          python -m pytest tests/test_push_via_api.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the commit-object read must be load-bearing
        run: python scripts/mutate_push_via_api_gates.py
      # A bare `PermissionError: [WinError 5]` from staging.rename cost a round
      # of investigation before it was classified as a same-second name
      # collision rather than a transient. Publishing now re-derives a free
      # name and retries, and gives up with a message that says why.
      - name: Two runs in the same second must not fight over one directory
        run: >
          python -m pytest tests/test_publish_name_collision.py
          -q -p no:cacheprovider --tb=short -rf
      - name: Mutation check — the retry must be load-bearing
        run: python scripts/mutate_publish_collision_gates.py
