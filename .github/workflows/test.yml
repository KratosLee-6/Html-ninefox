name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Release metadata consistency
        run: python scripts/check_release_version.py
      - run: python -m playwright install --with-deps chromium
      - name: Python and browser test suite
        run: python -m pytest tests -q -p no:cacheprovider
      - name: JavaScript syntax
        run: |
          node --check htmlninefox/server/static/canvas-engine.js
          node --check htmlninefox/server/static/canvas-productivity.js
          node --check htmlninefox/server/static/workbench-features.js
      - name: Chromium acceptance
        run: python e2e_verify.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: htmlninefox-test-evidence
          path: |
            e2e-shots/*.png
            e2e-output/**/.foxstate.json
          if-no-files-found: ignore