name: Shell (Tauri)

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-shell.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-shell.yml"

jobs:
  check-windows:
    # PLAN-v0.9 决策：Rust 位 Windows 先行（壳的发布目标平台），Linux/macOS 后补
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
      # Ubuntu 需要的 webkit 系统依赖（编译期链接）
      - name: Install Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - name: Stage placeholder sidecar (tauri-build validates resource paths)
        # 真正的 onedir 由发布流水线 shell-bundle job 暂存；check job 只验证
        # 编译——但 tauri-build 对 resources 路径的存在性是硬校验，缺了就 101
        shell: bash
        run: |
          mkdir -p src-tauri/sidecar/HtmlNineFox
          echo "placeholder: real onedir is staged by packaging/shell/build_shell_bundle.py" > src-tauri/sidecar/HtmlNineFox/PLACEHOLDER.txt
      - name: cargo check (shell)
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check
        continue-on-error: true # 首批放开；风格稳定后翻为硬门禁
