name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Release metadata consistency
        run: python scripts/check_release_version.py
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[packaging]"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: choco install innosetup -y --no-progress
      - run: python packaging/windows/build_portable.py --installer
      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/HtmlNineFox-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256.txt" -Encoding ascii
      - name: Run the built portable package
        # 「构建成功」不等于「能启动」。desktop.py 曾因缺 import sys 导致便携包与
        # 安装器一启动就 NameError，而本 job 只构建不执行，缺陷因此对 CI 完全隐形。
        # 这���真正把产物跑起来：版本、发行形态、首页、静态资源、干净退出。
        run: python packaging/verify_portable.py
      - uses: actions/upload-artifact@v7
        with:
          name: htmlninefox-windows
          path: release/*
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Release metadata consistency
        run: python scripts/check_release_version.py
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python packaging/linux/download_wheels.py
      - run: python packaging/linux/build_linux.py
      - uses: actions/upload-artifact@v7
        with:
          name: htmlninefox-linux
          path: release/*
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Release metadata consistency
        run: python scripts/check_release_version.py
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[packaging]"
      - run: python -m pip install pillow
      - run: python packaging/macos/build_macos.py
      - uses: actions/upload-artifact@v7
        with:
          name: htmlninefox-macos
          path: release/*
          if-no-files-found: error
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Release metadata consistency
        run: python scripts/check_release_version.py
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - name: Build Docker image
        run: docker build -t "htmlninefox:${{ github.ref_name }}" .
      - name: Verify Docker export runtime
        run: >-
          docker run --rm "htmlninefox:${{ github.ref_name }}"
          python -c "import os, playwright; assert os.path.isfile('/usr/bin/chromium'); print('export runtime ready')"
  package-payload:
    name: Package payload gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # 只需要能导入本包（tests/conftest.py 会 import server.app）与能跑 pytest。
      # wheel 是在临时目录里从源码现打的，不复用 pip 缓存里的任何产物。
      - run: python -m pip install ".[dev]" "setuptools>=68" "wheel"
      - name: Verify the real wheel payload
        # static/ 进包靠的是 pyproject.toml 里手写的 package-data 正则白名单。
        # 白名单少一条、或被改窄，产物就少文件，而构建 job 与全部测试都照样是绿的。
        # 这里真的打一个 wheel，打开 zip，逐个文件比对清单与字节。
        run: python scripts/verify_package_payload.py
      - name: Package payload gates
        run: python -m pytest tests/test_package_payload.py -q
      - name: Mutation-check the package payload gates
        # 「全过」不是证据。这一步真的把白名单删窄、把 STATIC_FILES 漏登记、
        # 在打包期静默丢弃文件与替换内容各做一遍，门禁必须每一条都变红。
        # 变异没生效记为 HARD FAIL 并让 job 非零退出——绝不记成 MISSED。
        run: python scripts/verify_package_payload.py --mutate
  # 建草稿 → 回读验证 → 转正式，分成三步。
  #
  # 之前是「建发布 + 上传」一步做完，然后就没有然后了。三个版本过去，产物从未在
  # 真正上传之后被读回过一次：v0.6.0 的便携包通过了四个构建 job 与全部测试，
  # 然后一启动就崩。构建 job 绿，只说明构建没坏，不说明**用户拿到的东西**没坏。
  #
  # 唯一的分法是草稿：草稿对用户不可见，所以验证失败时坏包从来没有出过门。
  # 代价说清楚：验证 job 若是网络抖动而非真缺陷，发布会卡在草稿，需要人工确认
  # 之后重跑或删掉草稿。这比悄悄发出去一个坏包便宜。
  publish-draft:
    name: Publish draft (invisible)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos, docker, package-payload]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: htmlninefox-*
          path: release-assets
          merge-multiple: true
      - name: Create or update the release as a DRAFT
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          notes="docs/RELEASE-NOTES-$tag.md"
          screenshot_dir="assets/screenshots/$tag"
          if [ ! -d "$screenshot_dir" ] && [ -d "assets/screenshots/${tag}-visual" ]; then
            screenshot_dir="assets/screenshots/${tag}-visual"
          fi
          if [ -d "$screenshot_dir" ]; then
            cp "$screenshot_dir"/*.png release-assets/
          fi
          # The brand films ship with the release, not just the repo. Only the
          # demo cuts and the stills fallback are attached; the raw H3 opener,
          # the music bed and the build scripts stay in the repo. Naming is
          # explicit rather than a glob so a future intermediate cut cannot
          # slip into a published release unnoticed.
          for asset in \
            assets/promo/htmlninefox-brand-demo-50s-16x9.mp4 \
            assets/promo/htmlninefox-brand-demo-53s-16x9-en.mp4 \
            assets/promo/htmlninefox-brand-film-34s-16x9.mp4 \
            assets/promo/htmlninefox-brand-film-34s-16x9-en.mp4; do
            if [ -f "$asset" ]; then
              cp "$asset" release-assets/
            else
              echo "::warning::release asset missing: $asset"
            fi
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            release_flags=()
            if [[ "$tag" == *rc* || "$tag" == *alpha* || "$tag" == *beta* ]]; then
              release_flags+=(--prerelease)
            fi
            if [ -f "$notes" ]; then
              gh release create "$tag" --draft --title "Html九尾狐 $tag" --notes-file "$notes" "${release_flags[@]}"
            else
              gh release create "$tag" --draft --title "Html九尾狐 $tag" --generate-notes "${release_flags[@]}"
            fi
          fi
          find release-assets -type f -print0 | xargs -0 gh release upload "$tag" --clobber
          echo "draft ready; verifying next"

  # Read every installable asset back off the release and check the bytes.
  #
  # This is deliberately against the *uploaded* copy rather than the build job's
  # output: what it proves is that the thing a user will download is intact, has
  # the front end inside it, and is the artifact the digest describes. Checking
  # the build output instead would be cheaper and would prove less.
  #
  # No --boot-windows here: this runs on ubuntu, and the portable is verified on
  # Windows by packaging/verify_portable.py. The boot check is a local concern.
  verify-release-assets:
    name: Verify uploaded release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download and check every installable asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python scripts/verify_release_assets.py
          "${{ github.ref_name }}"
          --asset "*.exe" --asset "*.zip" --asset "*.tar.gz"
          --asset "*.run" --asset "*.whl" --keep
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: htmlninefox-release-asset-evidence
          path: ${{ runner.temp }}/fox-release-*/
          if-no-files-found: ignore

  # Only reached when the bytes checked out. A failed verification leaves a
  # draft, which nobody can see, and a red job that says why.
  publish-finalize:
    name: Publish the verified release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify-release-assets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Flip the draft to published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json isDraft,tagName,assets \
            --jq '"published \(.tagName), \(.assets | length) assets"'
