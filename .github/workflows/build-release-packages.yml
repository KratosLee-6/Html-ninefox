name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Release metadata consistency
        run: python scripts/check_release_version.py
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[packaging]"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: choco install innosetup -y --no-progress
      - run: python packaging/windows/build_portable.py --installer
      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/HtmlNineFox-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256.txt" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: htmlninefox-windows
          path: release/*
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Release metadata consistency
        run: python scripts/check_release_version.py
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python packaging/linux/download_wheels.py
      - run: python packaging/linux/build_linux.py
      - uses: actions/upload-artifact@v7
        with:
          name: htmlninefox-linux
          path: release/*
          if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Release metadata consistency
        run: python scripts/check_release_version.py
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - name: Build Docker image
        run: docker build -t "htmlninefox:${{ github.ref_name }}" .
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: htmlninefox-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          notes="docs/RELEASE-NOTES-$tag.md"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ -f "$notes" ]; then
              gh release create "$tag" --title "Html九尾狐 $tag" --notes-file "$notes"
            else
              gh release create "$tag" --title "Html九尾狐 $tag" --generate-notes
            fi
          fi
          find release-assets -type f -print0 | xargs -0 gh release upload "$tag" --clobber
