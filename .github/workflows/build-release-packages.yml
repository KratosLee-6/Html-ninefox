name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[packaging]"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: choco install innosetup -y --no-progress
      - run: python packaging/windows/build_portable.py --installer
      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/HtmlNineFox-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256.txt" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: htmlninefox-windows
          path: release/*
          if-no-files-found: error
      - name: Upload Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release/HtmlNineFox-Setup-*.exe*
          gh release upload "${{ github.ref_name }}" $assets.FullName --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python packaging/linux/download_wheels.py
      - run: python packaging/linux/build_linux.py
      - uses: actions/upload-artifact@v7
        with:
          name: htmlninefox-linux
          path: release/*
          if-no-files-found: error